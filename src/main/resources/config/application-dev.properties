### ------------ General Config -----------------------
popcorn-society.identity.backend-host=http://localhost:8080
popcorn-society.identity.frontend-host=http://localhost:3000

# IntelliJ regenerates IDE metadata even during frontend/agent work. It changes no
# runtime behavior; do not drop active MCP requests by restarting Spring for it.
spring.devtools.restart.additional-exclude=META-INF/spring-configuration-metadata.json


### ------------ Movie Concierge MCP -----------------
popcorn-society.assistant.mcp.bearer-token=local-development-mcp-token


### ------------ Database Config ----------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/movie_db
spring.datasource.username=myroot
spring.datasource.password=secret


### ------------ Documentation Config -----------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


### ------------ Email Config -------------------------
popcorn-society.identity.email-verification-enabled=false
popcorn-society.notification.email.sender=placeholder
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.username=placeholder
spring.mail.password=placeholder@email.com


### ------------ Monitoring Config --------------------
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
logging.pattern.correlation=


### ------------ OpenSearch Config -----------------
opensearch.uris=http://localhost:9200
opensearch.username=
opensearch.password=


### ------------ Embeddings Config --------------------
popcorn-society.catalog.search.embedding.base-url=http://localhost:8082
popcorn-society.catalog.search.embedding.model=embeddinggemma


### ------------ Object Storage Config ----------------
popcorn-society.media.storage.uri=http://localhost:9000
popcorn-society.media.storage.access-key=ROOTNAME
popcorn-society.media.storage.secret-key=CHANGEME123
# Existing local bucket created by compose.yaml; contains the seeded images.
popcorn-society.media.storage.bucket-name=imdb-clone


### ------------ Security Config ---------------------
server.servlet.session.cookie.secure=false
popcorn-society.identity.webauthn.rp-id=localhost
popcorn-society.identity.webauthn.allowed-origins=http://localhost:3000
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dev-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dev-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Public development/test fixture only; never use this key for deployed mail.
popcorn-society.notification.outbox.keys.primary=${NOTIFICATION_OUTBOX_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
