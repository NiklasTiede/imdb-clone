spring.profiles.active=dev,test
imdb-clone.identity.rate-limit.enabled=false
spring.security.oauth2.client.registration.google.client-id=test-google-client
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=test-github-client
spring.security.oauth2.client.registration.github.client-secret=test-github-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Public development/test fixture only; never use this key for deployed mail.
imdb-clone.notification.outbox.keys.primary=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Cached test contexts must not each retain a full idle pool against the shared test database.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
