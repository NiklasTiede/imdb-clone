name: CD - Versioned app release

on:
  push:
    branches:
      - master
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: versioned-app-release
  cancel-in-progress: false

jobs:
  release-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be semver without leading v, got: $version" >&2
            exit 1
          fi
          {
            echo "value=$version"
            echo "tag=v$version"
            echo "branch=release/v${version}-deployment"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure release refs do not exist
        run: |
          if git rev-parse --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "Release tag ${{ steps.version.outputs.tag }} already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin \
            "refs/heads/${{ steps.version.outputs.branch }}" >/dev/null; then
            echo "Release branch ${{ steps.version.outputs.branch }} already exists" >&2
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build and test backend
        run: ./gradlew build jacocoTestReport

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Generate frontend API client
        working-directory: frontend
        run: yarn run build:moviesGen

      - name: Build frontend
        working-directory: frontend
        run: yarn build

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install locked agent dependencies
        run: make agent-sync

      - name: Verify agent
        run: make verify-agent

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/imdb-clone-backend:${{ steps.version.outputs.tag }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/imdb-clone-backend:latest" \
            --push \
            .

      - name: Build and push frontend image
        working-directory: frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/imdb-clone-frontend:${{ steps.version.outputs.tag }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/imdb-clone-frontend:latest" \
            --push \
            .

      - name: Build and push agent image
        working-directory: agent
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "APP_VERSION=${{ steps.version.outputs.value }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/imdb-clone-agent:${{ steps.version.outputs.tag }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/imdb-clone-agent:latest" \
            --push \
            .

      - name: Resolve image digests
        id: digests
        run: |
          backend_image="${{ secrets.DOCKERHUB_USERNAME }}/imdb-clone-backend:${{ steps.version.outputs.tag }}"
          frontend_image="${{ secrets.DOCKERHUB_USERNAME }}/imdb-clone-frontend:${{ steps.version.outputs.tag }}"
          agent_image="${{ secrets.DOCKERHUB_USERNAME }}/imdb-clone-agent:${{ steps.version.outputs.tag }}"
          backend_digest="$(docker buildx imagetools inspect "$backend_image" --format '{{.Manifest.Digest}}')"
          frontend_digest="$(docker buildx imagetools inspect "$frontend_image" --format '{{.Manifest.Digest}}')"
          agent_digest="$(docker buildx imagetools inspect "$agent_image" --format '{{.Manifest.Digest}}')"
          {
            echo "backend=${backend_digest}"
            echo "frontend=${frontend_digest}"
            echo "agent=${agent_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Update home-cluster app image manifests
        run: |
          backend_ref="${{ secrets.DOCKERHUB_USERNAME }}/imdb-clone-backend:${{ steps.version.outputs.tag }}@${{ steps.digests.outputs.backend }}"
          frontend_ref="${{ secrets.DOCKERHUB_USERNAME }}/imdb-clone-frontend:${{ steps.version.outputs.tag }}@${{ steps.digests.outputs.frontend }}"
          agent_ref="${{ secrets.DOCKERHUB_USERNAME }}/imdb-clone-agent:${{ steps.version.outputs.tag }}@${{ steps.digests.outputs.agent }}"
          sed -i "s|image: .*imdb-clone-backend:.*|image: ${backend_ref}|" infrastructure/clusters/home/apps/backend.yaml
          sed -i "s|image: .*imdb-clone-frontend:.*|image: ${frontend_ref}|" infrastructure/clusters/home/apps/frontend.yaml
          sed -i "s|image: .*imdb-clone-agent:.*|image: ${agent_ref}|" infrastructure/clusters/home/apps/agent.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify Movie Concierge production contracts
        run: make verify-movie-concierge-production
        env:
          EXPECTED_APP_VERSION: ${{ steps.version.outputs.value }}

      - name: Render and validate observability charts
        run: make verify-observability-charts

      - name: Validate rendered Kubernetes schemas
        run: make verify-kubernetes-schema

      - name: Commit deployment manifest update
        env:
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          if git diff --quiet infrastructure/clusters/home/apps/backend.yaml infrastructure/clusters/home/apps/frontend.yaml infrastructure/clusters/home/apps/agent.yaml; then
            echo "No deployment manifest changes for ${{ steps.version.outputs.tag }}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RELEASE_BRANCH"
          git add infrastructure/clusters/home/apps/backend.yaml infrastructure/clusters/home/apps/frontend.yaml infrastructure/clusters/home/apps/agent.yaml
          git commit -m "chore(release): deploy ${{ steps.version.outputs.tag }} image digests"
          git push --set-upstream origin "$RELEASE_BRANCH"

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" "${{ github.sha }}" \
            -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create deployment pull request
        id: deployment-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          body="$(printf '%s\n' \
            "## Deployment" \
            "" \
            "Deploys the immutable backend, frontend, and Movie Concierge images published as ${RELEASE_TAG}." \
            "" \
            "The release workflow verified all three image versions and Kubernetes production contracts before opening this pull request." \
            "Merging it lets Argo CD reconcile the production cluster from Git." \
            "" \
            "This pull request was created by the versioned app release workflow.")"
          pr_url="$(gh pr create \
            --base master \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): deploy ${RELEASE_TAG}" \
            --body "$body")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment pull request"
            echo
            echo "$pr_url"
            echo
            echo "Approve its CI run, review the three digest changes, and merge it to deploy through Argo CD."
          } >> "$GITHUB_STEP_SUMMARY"
