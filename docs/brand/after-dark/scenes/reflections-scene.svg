<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400" role="img" aria-labelledby="t d">
  <title id="t">Popcorn Society: Reflections</title>
  <desc id="d">A red neon popcorn carton sign swings on chains in the rain and is mirrored in a puddle. Two people share an umbrella. Occasionally the reflection shows eyes and a grin.</desc>
  <style>
    .swing{transform-box:view-box;transform-origin:100px 0;animation:swing 6s ease-in-out infinite}
    .flick{animation:flick 4.5s infinite}
    .flickL{animation:flick 4.5s infinite 1.3s}
    .wob{transform-box:view-box;transform-origin:100px 150px;animation:wob 3.2s ease-in-out infinite}
    .eyes{opacity:.1;animation:eyes 7s ease-in-out infinite}
    .bar{animation:bar 2.2s ease-in-out infinite alternate}
    .rip{transform-box:fill-box;transform-origin:center;opacity:0;animation:rip 2.6s ease-out infinite}
    .rain{animation:rain 1s linear infinite}
    @keyframes swing{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
    @keyframes flick{0%,60%,63%,66%,100%{opacity:1}61.5%{opacity:.3}64.5%{opacity:.3}}
    @keyframes wob{0%,100%{transform:skewX(0) scaleX(1)}50%{transform:skewX(-2deg) scaleX(1.02)}}
    @keyframes eyes{0%,70%,100%{opacity:.1}76%,86%{opacity:.95}}
    @keyframes bar{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
    @keyframes rip{0%{transform:scale(.1);opacity:0}10%{opacity:.9}100%{transform:scale(1);opacity:0}}
    @keyframes rain{from{transform:translate(0,-30px)}to{transform:translate(-14px,215px)}}
    @media (prefers-reduced-motion:reduce){.swing,.flick,.flickL,.wob,.bar,.rip,.rain{animation:none}.eyes{animation:none;opacity:.1}.rain{opacity:0}}
  </style>
  <defs>
    <g id="sign"><path d="M70 47C67.5 34.5 80 27 87.5 34.5C90 22 110 22 112.5 34.5C120 27 132.5 34.5 130 47"/><path d="M70 47H130L122.5 87H77.5Z"/><path d="M85 47L88.75 87M100 47V87M115 47L111.25 87M66 47H134"/></g>
    <g id="neon" fill="none" stroke-linecap="round" stroke-linejoin="round"><use href="#sign" stroke="#FF2D3F" stroke-opacity="0.2" stroke-width="9"/><use href="#sign" stroke="#FF2D3F" stroke-width="3"/><use href="#sign" stroke="#FFD6DB" stroke-width="1"/></g>
    <clipPath id="puddle"><path d="M30 132Q60 118 100 122Q150 118 176 134Q190 160 160 182Q110 196 60 186Q24 174 30 132Z"/></clipPath>
  </defs>
  <rect width="200" height="200" fill="#0A0C12"/>
  <path d="M0 14H200M0 30H200M0 46H200M0 62H200M0 78H200M0 94H200M30 14V30M90 30V46M150 14V30M20 46V62M170 46V62M60 62V78M140 78V94M40 78V94" stroke="#0F131C"/>
  <rect y="104" width="200" height="96" fill="#0C0F16"/>
  <g class="swing"><path d="M80 0V30M120 0V30" stroke="#2A3142" stroke-width="1.4" stroke-dasharray="3 2"/><g class="flick"><use href="#neon"/></g></g>
  <g clip-path="url(#puddle)">
    <path d="M30 132Q60 118 100 122Q150 118 176 134Q190 160 160 182Q110 196 60 186Q24 174 30 132Z" fill="#080A10"/>
    <g class="wob">
      <g transform="translate(0 208) scale(1 -1)" opacity="0.5"><g class="flick"><g class="swing"><use href="#neon"/></g></g></g>
      <g class="eyes"><path d="M86 133L95 136L86 139ZM114 133L105 136L114 139Z" fill="#FF2D3F"/><path d="M84 148L89 153L94 148L99 153L104 148L109 153L114 148" fill="none" stroke="#FF2D3F" stroke-width="1.6" stroke-linejoin="round"/></g>
    </g>
    <g fill="#080A10">
      <rect class="bar" x="30" y="128" width="140" height="2" style="animation-duration:2.2s"/>
      <rect class="bar" x="30" y="140" width="140" height="2" style="animation-duration:1.8s;animation-delay:-.6s"/>
      <rect class="bar" x="30" y="152" width="140" height="2.2" style="animation-duration:2.6s;animation-delay:-1.1s"/>
      <rect class="bar" x="30" y="164" width="140" height="2.2" style="animation-duration:2s;animation-delay:-.3s"/>
      <rect class="bar" x="30" y="176" width="140" height="2.4" style="animation-duration:2.4s;animation-delay:-1.5s"/>
    </g>
    <g fill="none" stroke="#4A5570" stroke-width="1" vector-effect="non-scaling-stroke">
      <ellipse class="rip" cx="66" cy="162" rx="16" ry="4"/>
      <ellipse class="rip" cx="136" cy="142" rx="14" ry="3.5" style="animation-delay:.9s"/>
      <ellipse class="rip" cx="106" cy="176" rx="18" ry="4.5" style="animation-delay:1.7s"/>
    </g>
  </g>
  <line x1="8" y1="104" x2="192" y2="104" stroke="#232A3A" stroke-width="1.5"/>
  <g fill="#161B27">
    <path d="M159 78V92" stroke="#161B27" stroke-width="1.2"/>
    <path d="M145 81Q159 66 173 81Q166 78 159 81Q152 78 145 81Z"/>
    <circle cx="154" cy="86" r="3.2"/><path d="M149.5 104L150.5 92Q154 89 157.5 92L158.5 104Z"/>
    <circle cx="164" cy="85" r="3.4"/><path d="M159.5 104L160.5 91.5Q164 88.5 167.5 91.5L168.5 104Z"/>
  </g>
  <g class="flickL" fill="none" stroke="#FF2D3F" stroke-opacity="0.65" stroke-width="0.8" stroke-linecap="round"><path d="M145 81Q149 75 156 71.5M150.8 86Q151 83 153 82.8M149.8 103L150.5 92.5"/></g>
  <g stroke="#262D3D" stroke-width="0.8" stroke-linecap="round">
    <path class="rain" d="M14 0l-3 10" style="animation-duration:.9s;animation-delay:-.2s"/>
    <path class="rain" d="M34 0l-3 10" style="animation-duration:1.1s;animation-delay:-.7s"/>
    <path class="rain" d="M52 0l-3 10" style="animation-duration:.95s;animation-delay:-.4s"/>
    <path class="rain" d="M68 0l-3 10" style="animation-duration:1.2s;animation-delay:-1s"/>
    <path class="rain" d="M86 0l-3 10" style="animation-duration:1s;animation-delay:-.1s"/>
    <path class="rain" d="M104 0l-3 10" style="animation-duration:.85s;animation-delay:-.55s"/>
    <path class="rain" d="M120 0l-3 10" style="animation-duration:1.15s;animation-delay:-.9s"/>
    <path class="rain" d="M138 0l-3 10" style="animation-duration:.9s;animation-delay:-.35s"/>
    <path class="rain" d="M156 0l-3 10" style="animation-duration:1.05s;animation-delay:-.8s"/>
    <path class="rain" d="M172 0l-3 10" style="animation-duration:.95s;animation-delay:-.15s"/>
    <path class="rain" d="M190 0l-3 10" style="animation-duration:1.1s;animation-delay:-.6s"/>
    <path class="rain" d="M24 0l-3 10" style="animation-duration:1.25s;animation-delay:-1.1s"/>
    <path class="rain" d="M112 0l-3 10" style="animation-duration:1.2s;animation-delay:-.25s"/>
    <path class="rain" d="M182 0l-3 10" style="animation-duration:.88s;animation-delay:-.65s"/>
  </g>
</svg>
