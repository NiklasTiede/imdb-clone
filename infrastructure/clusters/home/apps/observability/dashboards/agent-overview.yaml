          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (direction) (rate(imdb_agent_model_tokens_total[$__rate_interval]))",
              "legendFormat": "{{direction}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Model Token Rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "reqps"},
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 12},
          "id": 11,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (route, status) (rate(imdb_agent_http_requests_total[$__rate_interval]))",
              "legendFormat": "{{route}} {{status}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "HTTP Requests",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "none"},
            "overrides": []
          },
          "gridPos": {"h": 7, "w": 12, "x": 0, "y": 20},
          "id": 12,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true},
