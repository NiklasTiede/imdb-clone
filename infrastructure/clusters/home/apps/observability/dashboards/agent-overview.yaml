            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "100 * max(imdb_agent_process_budget_committed_usd) / clamp_min(max(imdb_agent_guardrail_limit{limit=\"project_cost_usd\"}), 0.01)",
              "legendFormat": "process budget",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Process Budget Used",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "reqps"},
            "overrides": []
