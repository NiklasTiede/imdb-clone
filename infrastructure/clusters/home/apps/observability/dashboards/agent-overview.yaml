            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(imdb_agent_run_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p95 complete run",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Agent Latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
