            {
              "editorMode": "code",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"imdb-clone\", container=\"agent\"}[$__range]))",
              "legendFormat": "container restarts",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Disconnects and Restarts",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "currencyUSD"},
            "overrides": []
          },
          "gridPos": {"h": 7, "w": 12, "x": 12, "y": 20},
          "id": 13,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true},
