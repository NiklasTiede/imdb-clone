            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(imdb_agent_first_event_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p95 first event",
              "range": true,
              "refId": "B"
