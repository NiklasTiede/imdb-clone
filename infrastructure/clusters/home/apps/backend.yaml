apiVersion: apps/v1
kind: Deployment
metadata:
  name: imdb-clone-backend
  namespace: imdb-clone
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: imdb-clone-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: imdb-clone-backend
    spec:
      containers:
        - name: backend
          image: niklastiede/imdb-clone-backend:v1.2.0@sha256:9fe6dc9f599d03bbef425214a16f691dc24c41ebcc6f53f4d9d8b516eeb86853
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: movie_concierge_mcp_enabled
              value: "true"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://imdb-clone-postgresql.databases.svc.cluster.local:5432/movie_db
            - name: OPENSEARCH_URIS
              value: http://imdb-clone-opensearch.databases.svc.cluster.local:9200
            - name: IMDB_CLONE_MEDIA_STORAGE_URI
              value: http://imdb-clone-rustfs.databases.svc.cluster.local:9000
            - name: IMDB_CLONE_CATALOG_SEARCH_EMBEDDING_BASE_URL
              value: http://imdb-clone-llama-cpp.databases.svc.cluster.local:8080
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318/v1/traces
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TIMEOUT
              value: 5s
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "0.1"
            - name: PYROSCOPE_APPLICATION_NAME
              value: imdb-clone-backend
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
            - name: PYROSCOPE_FORMAT
              value: jfr
            - name: PYROSCOPE_PROFILING_INTERVAL
              value: 20ms
            - name: PYROSCOPE_PROFILER_EVENT
              value: itimer
            - name: PYROSCOPE_PROFILER_ALLOC
              value: 512k
            - name: PYROSCOPE_PROFILER_LOCK
              value: 10ms
            - name: PYROSCOPE_UPLOAD_INTERVAL
              value: 15s
            - name: PYROSCOPE_PROFILE_EXPORT_TIMEOUT
              value: 5s
            - name: PYROSCOPE_INGEST_MAX_TRIES
              value: "2"
            - name: PYROSCOPE_LABELS
              value: environment=production
            - name: SPRING_APPLICATION_JSON
              value: |-
                {
                  "management": {
                    "metrics": {
                      "distribution": {
                        "percentiles-histogram": {
                          "http.server.requests": true
                        }
                      }
                    }
                  }
                }
          envFrom:
            - secretRef:
                name: backend-runtime
          volumeMounts:
            - name: movie-concierge-runtime
              mountPath: /run/secrets/movie-concierge
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: movie-concierge-runtime
          secret:
            secretName: movie-concierge-runtime
            defaultMode: 0440
            items:
              - key: mcp-bearer-token
                path: movie_concierge_mcp_bearer_token
---
apiVersion: v1
kind: Service
metadata:
  name: imdb-clone-backend
  namespace: imdb-clone
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: imdb-clone-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: imdb-clone-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8081
      targetPort: management
