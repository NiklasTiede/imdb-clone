apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pyroscope-private-ingress
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pyroscope
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: imdb-clone
          podSelector:
            matchLabels:
              app.kubernetes.io/name: imdb-clone-backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: imdb-clone
          podSelector:
            matchLabels:
              app.kubernetes.io/name: imdb-clone-agent
      ports:
        - protocol: TCP
          port: 4040
