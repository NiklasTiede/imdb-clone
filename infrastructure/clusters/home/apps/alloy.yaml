apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.11.1
    helm:
      releaseName: alloy
      valuesObject:
        global:
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 473
            runAsGroup: 473
            fsGroup: 473
            supplementalGroups:
              # systemd-journal on the home-cluster node
              - 999
            seccompProfile:
              type: RuntimeDefault
        crds:
          create: false
        controller:
          type: daemonset
          terminationGracePeriodSeconds: 30
          volumes:
            extra:
              - name: storage
                emptyDir: {}
        alloy:
          enableReporting: false
          storagePath: /var/lib/alloy
          extraEnv:
            - name: ALLOY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          mounts:
            varlog: true
            extra:
              - name: storage
                mountPath: /var/lib/alloy
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
              appProtocol: h2c
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
          configMap:
            content: |-
              logging {
                level  = "info"
                format = "json"
              }

              discovery.kubernetes "pods" {
                role = "pod"

                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                  regex         = "(.+)"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "service"
                  regex         = "(.+)"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                  regex         = "(.+)"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "service"
                  regex         = "(.+)"
                }

                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
                  target_label  = "job"
                  separator     = "/"
                  replacement   = "$1"
                }
              }

              loki.source.kubernetes "pod_logs" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.process.pod_logs.receiver]
              }

              loki.process "pod_logs" {
                stage.static_labels {
                  values = {
                    cluster = "home-k3s",
                  }
                }

                stage.json {
                  expressions = {
                    event      = "event",
                    level      = "level",
                    log_level  = "log_level",
                    request_id = "request_id",
                    span_id    = "span_id",
                    spanId     = "spanId",
                    trace_id   = "trace_id",
                    traceId    = "traceId",
                  }
                }

                stage.regex {
                  expression = "^(?:\\d{4}-\\d{2}-\\d{2}T\\S+\\s+)?\\s*\\[?(?P<plain_level>(?i:trace|debug|info|warn(?:ing)?|error|fatal|critical))\\]?(?:\\s|$)"
                }

                stage.template {
                  source   = "log_level"
                  template = "{{ `{{ if eq (ToLower .Value) \"warning\" }}warn{{ else }}{{ ToLower .Value }}{{ end }}` }}"
                }

                stage.labels {
                  values = {
                    level = "log_level",
                  }
                }

                stage.template {
                  source   = "plain_level"
                  template = "{{ `{{ if eq (ToLower .Value) \"warning\" }}warn{{ else }}{{ ToLower .Value }}{{ end }}` }}"
                }

                stage.labels {
                  values = {
                    level = "plain_level",
                  }
                }

                stage.template {
                  source   = "level"
                  template = "{{ `{{ if eq (ToLower .Value) \"warning\" }}warn{{ else }}{{ ToLower .Value }}{{ end }}` }}"
                }

                stage.labels {
                  values = {
                    level = "level",
                  }
                }

                // Nginx access logs do not carry a textual level. Classify them
                // by HTTP response class so Grafana Logs Drilldown can color and
                // filter ordinary traffic, client errors, and server errors.
                stage.match {
                  selector = "{app=\"imdb-clone-frontend\"} |~ \" [1-3][0-9]{2} [0-9]+ \""

                  stage.static_labels {
                    values = {
                      level = "info",
                    }
                  }
                }

                stage.match {
                  selector = "{app=\"imdb-clone-frontend\"} |~ \" 4[0-9]{2} [0-9]+ \""

                  stage.static_labels {
                    values = {
                      level = "warn",
                    }
                  }
                }

                stage.match {
                  selector = "{app=\"imdb-clone-frontend\"} |~ \" 5[0-9]{2} [0-9]+ \""

                  stage.static_labels {
                    values = {
                      level = "error",
                    }
                  }
                }

                // llama.cpp prefixes structured runtime messages with a compact
                // single-letter severity after its monotonic timestamp.
                stage.match {
                  selector = "{app=\"imdb-clone-llama-cpp\"} |~ \"^[^ ]+ +T +\""

                  stage.static_labels {
                    values = {
                      level = "trace",
                    }
                  }
                }

                stage.match {
                  selector = "{app=\"imdb-clone-llama-cpp\"} |~ \"^[^ ]+ +D +\""

                  stage.static_labels {
                    values = {
                      level = "debug",
                    }
                  }
                }

                stage.match {
                  selector = "{app=\"imdb-clone-llama-cpp\"} |~ \"^[^ ]+ +I +\""

                  stage.static_labels {
                    values = {
                      level = "info",
                    }
                  }
                }

                stage.match {
                  selector = "{app=\"imdb-clone-llama-cpp\"} |~ \"^[^ ]+ +W +\""

                  stage.static_labels {
                    values = {
                      level = "warn",
                    }
                  }
                }

                stage.match {
                  selector = "{app=\"imdb-clone-llama-cpp\"} |~ \"^[^ ]+ +E +\""

                  stage.static_labels {
                    values = {
                      level = "error",
                    }
                  }
                }

                stage.structured_metadata {
                  values = {
                    event      = "event",
                    request_id = "request_id",
                    span_id    = "span_id",
                    spanId     = "spanId",
                    trace_id   = "trace_id",
                    traceId    = "traceId",
                  }
                }

                forward_to = [loki.write.cluster.receiver]
              }

              loki.source.journal "k3s" {
                path       = "/var/log/journal"
                max_age    = "24h"
                matches    = "_SYSTEMD_UNIT=k3s.service"
                forward_to = [loki.write.cluster.receiver]

                labels = {
                  app       = "k3s",
                  cluster   = "home-k3s",
                  job       = "systemd-journal",
                  namespace = "kube-system",
                  node      = sys.env("ALLOY_NODE_NAME"),
                  service   = "k3s",
                  unit      = "k3s.service",
                }
              }

              loki.source.kubernetes_events "cluster" {
                job_name   = "integrations/kubernetes/eventhandler"
                log_format = "logfmt"
                forward_to = [loki.process.cluster_events.receiver]
              }

              loki.process "cluster_events" {
                stage.static_labels {
                  values = {
                    cluster = "home-k3s",
                  }
                }

                stage.logfmt {
                  mapping = {
                    event_type = "type",
                  }
                }

                stage.template {
                  source   = "event_level"
                  template = "{{ `{{ if eq (ToLower .event_type) \"warning\" }}warn{{ else }}info{{ end }}` }}"
                }

                stage.labels {
                  values = {
                    level = "event_level",
                  }
                }

                forward_to = [loki.write.cluster.receiver]
              }

              loki.write "cluster" {
                endpoint {
                  url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
                }
              }

              otelcol.receiver.otlp "cluster" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }

                http {
                  endpoint = "0.0.0.0:4318"
                }

                output {
                  traces = [otelcol.processor.batch.traces.input]
                }
              }

              otelcol.processor.batch "traces" {
                timeout         = "5s"
                send_batch_size = 512

                output {
                  traces = [otelcol.exporter.otlphttp.tempo.input]
                }
              }

              otelcol.exporter.otlphttp "tempo" {
                client {
                  endpoint = "http://tempo.observability.svc.cluster.local:4318"
                }
              }
        serviceMonitor:
          enabled: true
          interval: 30s
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
