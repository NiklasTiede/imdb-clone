apiVersion: apps/v1
kind: Deployment
metadata:
  name: imdb-clone-agent
  namespace: imdb-clone
spec:
  template:
    spec:
      containers:
        - name: agent
          env:
            - name: POPCORN_SOCIETY_AGENT_VOICE_ALLOWED_ORIGINS
              value: '["https://popcornsociety.app","https://imdb-clone.the-coding-lab.com"]'
            - name: POPCORN_SOCIETY_AGENT_ALLOWED_HOSTS
              value: '["popcornsociety.app","imdb-clone.the-coding-lab.com","imdb-clone-agent","imdb-clone-agent.imdb-clone","imdb-clone-agent.imdb-clone.svc","imdb-clone-agent.imdb-clone.svc.cluster.local"]'
