name: popcorn-society

services:

  ### ----------------------- PostgreSQL ----------------------- ###
  popcorn-society-postgresql:
    container_name: popcorn-society-postgresql
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=movie_db
      - POSTGRES_USER=myroot
      - POSTGRES_PASSWORD=secret
    ports:
      - "5432:5432"
    volumes:
      - popcorn-society-postgresql-data:/var/lib/postgresql
    networks:
      - popcorn-society-network

  ### ----------------------- OpenSearch --------------------- ###
  popcorn-society-opensearch:
    container_name: popcorn-society-opensearch
    image: opensearchproject/opensearch:3.6.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx2g
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
    volumes:
      - popcorn-society-opensearch-data:/usr/share/opensearch/data
    networks:
      - popcorn-society-network

  ### ----------------------- RustFS ----------------------- ###
  popcorn-society-rustfs:
    container_name: popcorn-society-rustfs
    image: rustfs/rustfs:1.0.0-beta.2
    restart: unless-stopped
    user: root
    environment:
      - RUSTFS_ACCESS_KEY=ROOTNAME
      - RUSTFS_SECRET_KEY=CHANGEME123
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - popcorn-society-rustfs-data:/data
    networks:
      - popcorn-society-network
    command: /data

  popcorn-society-rustfs-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - popcorn-society-rustfs
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        rm -f /tmp/bucket-ready
        until mc alias set rustfs http://popcorn-society-rustfs:9000 "$$ACCESS_KEY" "$$SECRET_KEY"; do
          sleep 2
        done
        mc mb --ignore-existing rustfs/imdb-clone
        mc anonymous set download rustfs/imdb-clone/movies
        mc anonymous set download rustfs/imdb-clone/profile-photos
        touch /tmp/bucket-ready
        # Spring Boot uses compose up --wait, which rejects an exited init service.
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bucket-ready"]
      interval: 2s
      timeout: 1s
      retries: 60
    environment:
      - ACCESS_KEY=ROOTNAME
      - SECRET_KEY=CHANGEME123
    networks:
      - popcorn-society-network

  ### ----------------------- llama.cpp ----------------------- ###
  popcorn-society-llama-cpp:
    container_name: popcorn-society-llama-cpp
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      - LLAMA_ARG_ENDPOINT_METRICS=1
    ports:
      - "8082:8080"
    volumes:
      - popcorn-society-llama-cpp-cache:/root/.cache
    networks:
      - popcorn-society-network
    command:
      - -hf
      - ggml-org/embeddinggemma-300M-GGUF
      - --embeddings
      - --host
      - 0.0.0.0
      - --port
      - "8080"

  popcorn-society-seed-light:
    image: ${POPCORN_SOCIETY_SEED_LIGHT_IMAGE:-niklastiede/imdb-clone-seed:light-local}
    profiles:
      - seed-light
    depends_on:
      - popcorn-society-postgresql
      - popcorn-society-rustfs
    environment:
      - POSTGRES_HOST=popcorn-society-postgresql
      - POSTGRES_DB=movie_db
      - POSTGRES_USER=myroot
      - POSTGRES_PASSWORD=secret
      - RUSTFS_ENDPOINT=http://popcorn-society-rustfs:9000
      - RUSTFS_ACCESS_KEY=ROOTNAME
      - RUSTFS_SECRET_KEY=CHANGEME123
      - RUSTFS_BUCKET=imdb-clone
      - SEED_NAME=light
      - SEED_VERSION=${SEED_VERSION:-local}
    networks:
      - popcorn-society-network

  popcorn-society-seed-full:
    image: ${POPCORN_SOCIETY_SEED_FULL_IMAGE:-niklastiede/imdb-clone-seed:full-local}
    profiles:
      - seed-full
    depends_on:
      - popcorn-society-postgresql
      - popcorn-society-rustfs
    environment:
      - POSTGRES_HOST=popcorn-society-postgresql
      - POSTGRES_DB=movie_db
      - POSTGRES_USER=myroot
      - POSTGRES_PASSWORD=secret
      - RUSTFS_ENDPOINT=http://popcorn-society-rustfs:9000
      - RUSTFS_ACCESS_KEY=ROOTNAME
      - RUSTFS_SECRET_KEY=CHANGEME123
      - RUSTFS_BUCKET=imdb-clone
      - SEED_NAME=full
      - SEED_VERSION=${SEED_VERSION:-local}
    networks:
      - popcorn-society-network

# Physical names intentionally retain existing local data; do not use down --volumes.
volumes:
  popcorn-society-postgresql-data:
    name: imdb-clone-postgresql-data
  popcorn-society-opensearch-data:
    name: imdb-clone-opensearch-data
  popcorn-society-rustfs-data:
    name: imdb-clone-rustfs-data
  popcorn-society-llama-cpp-cache:
    name: imdb-clone-llama-cpp-cache

networks:
  popcorn-society-network:
    name: popcorn-society-network
    driver: bridge
